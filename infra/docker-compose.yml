name: concord

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concord}
      POSTGRES_DB: concord
    ports:
      - "5433:5432" # 5433 no host para não colidir com outro Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # SFU de voz e vídeo. Em desenvolvimento anuncia 127.0.0.1; em produção troque node_ip pelo IP público
  # (ou use_external_ip: true) e libere 7881/tcp e 7882/udp no firewall.
  livekit:
    image: livekit/livekit-server:v1.13.11
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY:-concord-dev}: ${LIVEKIT_API_SECRET:-concord-dev-secret-troque-em-producao-0123456789}
        room:
          empty_timeout: 30
        webhook:
          api_key: ${LIVEKIT_API_KEY:-concord-dev}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://host.docker.internal:8080/api/livekit/webhook}
        logging:
          level: info
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Servidor Go (API + gateway). Em desenvolvimento, prefira rodar com `go run` fora do Docker.
  server:
    profiles: ["full"]
    build: ../server
    environment:
      DATABASE_URL: postgres://concord:${POSTGRES_PASSWORD:-concord}@postgres:5432/concord?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CONCORD_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
